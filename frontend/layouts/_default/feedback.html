{{ define "main" -}}
{{ .Content }}
<form class="feedback" action="https://github.com/{{ site.Params.repository }}/issues/new" method="get">
	<label for="title">Title</label>
	<input id="title" name="title" type="text" required maxlength="200" placeholder="e.g. Missing CAV 2026 paper by Jane Doe">
	<label for="body">Details</label>
	<textarea id="body" name="body" rows="10" required placeholder="Tell us what is missing or needs fixing (a paper, area, researcher, or group), which page it's on, and a link if you have one."></textarea>
	<div class="fb-actions">
		<button type="submit">Continue on GitHub</button>
		<button type="button" class="fb-mail" data-to="hi@thanhle.xyz">Send by email</button>
	</div>
</form>
{{- end }}
